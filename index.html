<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Pakistan Tehsils Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin></script>
<link rel="icon" href="data:,">
<style>
  html, body { height: 100%; margin: 0; padding: 0; }
  body { display: flex; font-family: Arial, sans-serif; }
  #sidebar { width: 15%; background: #2E6F40; overflow-y: auto; padding: 10px; border-right: 1px solid #ccc; }
  #map { flex: 1; height: 100%; position: relative; }
  #info-box { position: absolute; top: 10px; left: 30%; transform: translateX(-50%);
              z-index: 1000; padding: 8px 15px; background: rgba(255,255,255,0.95);
              border: 1px solid #333; border-radius: 5px; font-weight: bold;
              pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,0.3); display: block; }
  h3 { margin: 10px 0 5px 0; font-size: 14px; color: #FFFFFF; cursor: default; }
  .district-item {
  cursor: pointer;
  padding: 5px;
  margin: 2px 0;
  border-radius: 5px;
  padding-left: 15px;
  color: white;               /* text color white */
  font-size: 14px;
}

.province-label span {
  font-size: 14px;
  font-weight: bold;
  color: white;
  background: rgba(0,0,0,0.6);
  padding: 2px 5px;
  border-radius: 3px;
}
  
.district-item:hover {
  background-color: #3b8f52;  /* lighter green hover */
  color: #fff;                /* keep text white on hover */
}
  .toggle-container { margin-bottom: 10px; }
  button { display:block; margin-top: 5px; }

  #sidebar label {
  font-size: 14px;   /* 👈 adjust size here */
  color: white;      /* optional: match sidebar text color */
}

  
</style>
</head>
<body>

<div id="sidebar">
  <div class="toggle-container">
    <input type="checkbox" id="toggle-callout" checked>
    <label for="toggle-callout">Show Callout</label>
  </div>

  <div class="toggle-container">
    <input type="checkbox" id="toggle-tooltip" checked>
    <label for="toggle-tooltip">Show Hover Tooltip</label>
  </div>

  <div class="toggle-container">
    <input type="checkbox" id="province-btn">
    <label for="province-btn">Show Province</label>
  </div>

  <div class="toggle-container">
    <input type="checkbox" id="tehsil-btn" checked>
    <label for="tehsil-btn">Show Tehsil</label>
  </div>

   <div class="toggle-container">
    <input type="checkbox" id="water-btn">
    <label for="water-btn">Show Water Map</label>
  </div>

  <div class="toggle-container">
    <label for="color-picker">Tehsil Highlight Color:</label><br>
    <input type="color" id="color-picker" value="#ffa500" style="width:50%; margin-top:10px;">
  </div>

  <div class="toggle-container">
    <label for="color-picker-map-bgrd">Map Fill Color:</label><br>
    <input type="color" id="color-picker-map-bgrd" value="#90EE90" style="width:50%; margin-top:5px;">
  </div>

  <div class="toggle-container">
    <label for="color-picker-map-line">Map Line Color:</label><br>
    <input type="color" id="color-picker-map-line" value="#000000" style="width:50%; margin-top:5px;">
  </div>

  <div class="toggle-container">
    <button id="clear-btn" style="width:50%; height:40px; background:#f08080;">Clear Selection</button>
  </div>

  <div class="toggle-container">
  <div style="display:flex; align-items:center; margin-bottom:5px;">
    <button id="btn1" style="flex:1;">Cotton</button>
    <input type="color" id="color-cotton" value="#ffa500" style="margin-left:5px; width:30px; height:30px;">
  </div>
  <div style="display:flex; align-items:center; margin-bottom:5px;">
    <button id="btn2" style="flex:1;">Rice</button>
    <input type="color" id="color-rice" value="#e6d136" style="margin-left:5px; width:30px; height:30px;">
  </div>
  <div style="display:flex; align-items:center; margin-bottom:5px;">
    <button id="btn3" style="flex:1;">Sesame</button>
    <input type="color" id="color-sesame_seed" value="#87CEEB" style="margin-left:5px; width:30px; height:30px;">
  </div>
  <div style="display:flex; align-items:center; margin-bottom:5px;">
    <button id="btn4" style="flex:1;">Wheat</button>
    <input type="color" id="color-wheat" value="#F08080" style="margin-left:5px; width:30px; height:30px;">
  </div>
    
 </div>
</div>

<div id="map">
  <div id="info-box">Hover over a tehsil or click to see details here</div>
</div>

<script>
/* ==== Global variables ==== */
var calloutEnabled = true;
var tooltipEnabled = true;
var currentHighlightColor = "#ffa500"; 
var mapColor = "#90EE90";
var mapLineColor = "#000000";

var map = L.map('map').setView([30.0, 70.0], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

var geojsonLayer = null;
var allLayers = [];
var cropData = null;
var pakprovince = null;
var pakwater = null;
var activeCrops = new Set();
let provinceLayer, provinceLabels = [];  
let watereLayer, waterLabels = [];  

/* ==== UI controls ==== */
document.getElementById('toggle-callout').addEventListener('change', function() {
  calloutEnabled = this.checked;
  document.getElementById('info-box').style.display = calloutEnabled ? 'block' : 'none';
});

document.getElementById('toggle-tooltip').addEventListener('change', function() {
  tooltipEnabled = this.checked;
  allLayers.forEach(layer => {
    if (!tooltipEnabled && layer.getTooltip()) layer.unbindTooltip();
    else if (tooltipEnabled && !layer.getTooltip() && layer.feature.properties.shapeName) {
      layer.bindTooltip(layer.feature.properties.shapeName, { permanent: false });
    }
  });
});

document.getElementById('color-picker').addEventListener('input', function() {
  currentHighlightColor = this.value;
});

document.getElementById('color-picker-map-bgrd').addEventListener('input', function() {
  mapColor = this.value;
  if (geojsonLayer) geojsonLayer.setStyle(defaultStyle);
});

document.getElementById('color-picker-map-line').addEventListener('input', function() {
  mapLineColor = this.value;
  if (geojsonLayer) geojsonLayer.setStyle(defaultStyle);
});

document.getElementById('clear-btn').addEventListener('click', function() {
  clearHighlights();
});

/* ==== Highlight a layer ==== */
function toggleHighlight(layer) {
  if (layer._isHighlighted) {
    layer._isHighlighted = false;
    delete layer._highlightColor;
    geojsonLayer.resetStyle(layer);
    if (!tooltipEnabled) layer.closeTooltip();
  } else {
    layer._isHighlighted = true;
    layer._highlightColor = currentHighlightColor;
    layer.setStyle({
      fillColor: layer._highlightColor,
      color: mapLineColor,
      weight: 3,
      fillOpacity: 0.75
    });
    layer.bringToFront();
    if (tooltipEnabled) layer.openTooltip();
  }
}

  
/* ==== Load ADM3 GeoJSON ==== */
fetch('geoBoundaries-PAK-ADM3.geojson')
  .then(r => r.json())
  .then(data => {
    geojsonLayer = L.geoJSON(data, {
      style: defaultStyle,
      onEachFeature: function(feature, layer) {
        allLayers.push(layer);
        if (feature.properties && feature.properties.shapeName) {
          layer.bindTooltip(feature.properties.shapeName, { permanent: false });

          layer.on('mouseover', function() {
            if (calloutEnabled) showInfo(feature.properties.shapeName);
            if (tooltipEnabled) layer.openTooltip();
          });
          layer.on('mouseout', function() {
            if (calloutEnabled) clearInfo();
            if (tooltipEnabled) layer.closeTooltip();
          });
          layer.on('click', function() {
            toggleHighlight(layer);
            if (calloutEnabled) showInfo(feature.properties.shapeName);
          });
        }
      }
    }).addTo(map);

    map.fitBounds(geojsonLayer.getBounds());
    buildSidebar(data);

     document.getElementById('tehsil-btn').addEventListener('change', function () {
      if (this.checked) {
        geojsonLayer.addTo(map);
        geojsonLayer.bringToFront();
      } else {
        map.removeLayer(geojsonLayer);
      }
    });
  });  // ✅ closes ADM3 fetch

/* ==== Load Province Layer ==== */
fetch('pak_boundry_rev.json')
  .then(r => r.json())
  .then(data => {
    pakprovince = L.geoJSON(data, {
      style: {
        fillColor: 'transparent',
        fillOpacity: 0,
        color: "#000000",
        weight: 3,
        opacity: 1
      },
      interactive: false,
      onEachFeature: function(feature, layer) {
        if (feature.properties && feature.properties.name) {
          layer.bindTooltip(feature.properties.name);
        }
      }
    });

  document.getElementById('province-btn').addEventListener('change', function () {
  if (this.checked) {
    showProvinces();
  } else {
    // Remove province layer
    if (provinceLayer) map.removeLayer(provinceLayer);

    // Remove labels + lines
    provinceLabels.forEach(l => map.removeLayer(l));
    provinceLabels = [];
  }
  });
});

/* ==== Load Water Layer ==== */
fetch('pak_waterways_10pc.json')
  .then(r => r.json())
  .then(data => {
    pakwater = L.geoJSON(data, {
      style: {
        fillColor: 'transparent',
        fillOpacity: 0,
        color: "#0000FF", // 💧 Blue rivers
        weight: 1,
        opacity: 1
      },
      interactive: true,
      onEachFeature: function(feature, layer) {
        if (feature.properties && feature.properties.name) {
          layer.bindTooltip(feature.properties.name);
        }
      }
    });

    document.getElementById('water-btn').addEventListener('change', function () {
      if (this.checked) {
        showRivers(); // turn rivers ON
      } else {
        // Remove water layer
        if (pakwater) map.removeLayer(pakwater);

        // Remove labels + lines
        riverLabels.forEach(l => map.removeLayer(l));
        riverLabels = [];
      }
    });
  });

  // ==== Load Crop Data ====
  fetch('crops.json')
    .then(r => r.json())
    .then(data => cropData = data);

  
 /* ==== Styles ==== */
function defaultStyle(feature) {
  return {
    fillColor: feature._highlightColor || mapColor,
    color: mapLineColor,
    weight: feature._isHighlighted ? 2 : 1,
    fillOpacity: feature._isHighlighted ? 0.75 : 0.8
  };
}

/* ==== Info Box ==== */
function showInfo(name) { document.getElementById('info-box').innerHTML = "<b>Selected Tehsil:</b> " + name; }
function clearInfo() { document.getElementById('info-box').innerHTML = "Hover over a tehsil or click to see details here"; }


  
/* ==== Highlight Functions ==== */
function toggleCrop(cropName) {
  if (!cropData) {
    console.warn("Crop data not yet loaded!");
    return;
  }
  if (activeCrops.has(cropName)) removeCropHighlight(cropName), activeCrops.delete(cropName);
  else highlightCrop(cropName), activeCrops.add(cropName);

  if (activeCrops.size === 0) clearHighlights();
}

function clearHighlights() {
  geojsonLayer.eachLayer(layer => {
    layer._isHighlighted = false;
    delete layer._highlightColor;
    delete layer._highlightBy;
    geojsonLayer.resetStyle(layer);
  });
}

/* ==== Sidebar ==== */
function buildSidebar(data) {
  let sidebar = document.getElementById('sidebar');
  let groups = {};
  data.features.forEach(f => {
    if (f.properties && f.properties.shapeGroup && f.properties.shapeName) {
      let group = f.properties.shapeGroup;
      if (!groups[group]) groups[group] = [];
      groups[group].push(f);
    }
  });

  Object.keys(groups).sort().forEach(group => {
    let heading = document.createElement('h3');
    heading.textContent = group;
    sidebar.appendChild(heading);

    groups[group].sort((a,b) => a.properties.shapeName.localeCompare(b.properties.shapeName))
      .forEach(f => {
        let div = document.createElement('div');
        div.className = 'district-item';
        div.textContent = f.properties.shapeName;
        div.onclick = () => { highlightDistrict(f.properties.shapeName); if(calloutEnabled) showInfo(f.properties.shapeName); };
        sidebar.appendChild(div);
      });
  });
}

function highlightDistrict(name) {
  geojsonLayer.eachLayer(layer => {
    if (layer.feature.properties.shapeName === name) toggleHighlight(layer);
  });
}

/* ==== Crop Highlights ==== */
function getCropColor(cropName) {
  let input = document.getElementById("color-" + cropName);
  return input ? input.value : "#ffa500";
}

function highlightCrop(cropName) {
  if (!cropData || !cropData[cropName]) return;

  Object.values(cropData[cropName]).forEach(provinceObj => {
    Object.values(provinceObj).forEach(districtList => {
      districtList.forEach(districtName => {
        geojsonLayer.eachLayer(layer => {
          if (layer.feature.properties.shapeName &&
              layer.feature.properties.shapeName.toLowerCase() === districtName.toLowerCase()) {

            layer._highlightBy = layer._highlightBy || {};
            layer._highlightBy[cropName] = getCropColor(cropName);

            let lastColor = Object.values(layer._highlightBy).slice(-1)[0];
            layer._isHighlighted = true;
            layer._highlightColor = lastColor;
            layer.setStyle({ fillColor: lastColor, color: mapLineColor, weight: 2, fillOpacity:0.75 });
            layer.bringToFront();
          }
        });
      });
    });
  });
}

function removeCropHighlight(cropName) {
  if (!cropData || !cropData[cropName]) return;

  Object.values(cropData[cropName]).forEach(provinceObj => {
    Object.values(provinceObj).forEach(districtList => {
      districtList.forEach(districtName => {
        geojsonLayer.eachLayer(layer => {
          if (layer.feature.properties.shapeName &&
              layer.feature.properties.shapeName.toLowerCase() === districtName.toLowerCase()) {

            if (layer._highlightBy) delete layer._highlightBy[cropName];

            if (layer._highlightBy && Object.keys(layer._highlightBy).length > 0) {
              let lastColor = Object.values(layer._highlightBy).slice(-1)[0];
              layer._highlightColor = lastColor;
              layer.setStyle({ fillColor: lastColor, color: mapLineColor, weight:2, fillOpacity:0.75 });
            } else {
              layer._isHighlighted = false;
              delete layer._highlightColor;
              geojsonLayer.resetStyle(layer);
            }
          }
        });
      });
    });
  });
}

function toggleCrop(cropName) {
  if (!cropData) return;
  if (activeCrops.has(cropName)) removeCropHighlight(cropName), activeCrops.delete(cropName);
  else {
    highlightCrop(cropName);
    activeCrops.add(cropName);
  }

  if (activeCrops.size === 0) clearHighlights();
}



// === Function to show province outlines + labels ===
function showProvinces() {
  if (pakprovince) {
    provinceLayer = pakprovince.addTo(map);  
    provinceLayer.bringToFront();

    // Province definitions (center = inside polygon, label = where box should be placed)
    let provinces = [
     { name: "Punjab", center: [31.0, 72.0], label: [31.5, 76.0], color: "#4CAF50" },   // green
      { name: "Sindh", center: [25.5, 68.5], label: [26.5, 72.0], color: "#4CAF50" },   // blue #2196F3"
      { name: "Balochistan", center: [28.5, 65.0], label: [30.5, 63.3], color: "#4CAF50" }, // orange "#FF5722"
      { name: "Khyber Pakhtunkhwa", center: [34.0, 71.5], label: [35.0, 66.0], color: "#4CAF50" }, // purple "#9C27B0"
      { name: "Azad Kashmir", center: [34.5, 73.5], label: [35.5, 79.0], color: "#4CAF50" }, // yellow "#FFC107"
      { name: "Gilgit Baltistan", center: [36.5, 74.5], label: [37.0, 69.0], color: "#4CAF50" }  // brown "#795548"
    ];

    provinces.forEach(p => {
      // Draw line from province center to label box
      let line = L.polyline([p.center, p.label], { color: 'black', weight: 1 }).addTo(map);

      // Add label with colored background box
      let text = L.marker(p.label, {
        icon: L.divIcon({
        className: 'province-label',
        html: `<div style="
        display:inline-block;
        background:${p.color};
        color:white;
        padding:4px 10px;
        border-radius:5px;
        font-size:12px;
        font-weight:bold;
        text-align:center;
        white-space:nowrap;
        box-shadow:0 2px 5px rgba(0,0,0,0.3);">
          ${p.name}
        </div>`
        })
      }).addTo(map);

      provinceLabels.push(line, text);
    });
  }
}


  // === Function to Show River outlines + labels ===
 function showRivers() {
  if (pakwater) {
    watereLayer = pakwater.addTo(map);  
    watereLayer.bringToFront();

    // Province definitions (center = inside polygon, label = where box should be placed)
    let rivers = [
     { name: "Indus River", center: [32.0, 71.0], label: [32.0, 66.0], color: "#2196F3" },   // green
      { name: "Jehlum River", center: [32.0, 73.1], label: [32.0, 76.0], color: "#2196F3" },   // blue "#2196F3"
      { name: "Chenab River", center: [31.0, 72.0], label: [31.0, 66.0], color: "#2196F3" }, // orange "#FF5722"
      { name: "Ravi River", center: [31.0, 74.2], label: [31.0, 76.0], color: "#2196F3" }, // purple "#9C27B0"
      { name: "Satluj River", center: [29.0, 73.0], label: [29.0, 76.0], color: "#2196F3" }, // yellow "#FFC107"
      { name: "Punjnad", center: [29.0, 71.0], label: [29.0, 74.0], color: "#795548" },  // brown "#795548"
      { name: "Tarbela Dam", center: [33.1, 73.0], label: [33.1, 76.0], color: "#795548" },  // brown "#795548"
      { name: "Mangla Dam", center: [34.0, 72.6], label: [34.0, 69.0], color: "#795548" }, 
      { name: "Kala Bag (Location)", center: [32.9, 71.5], label: [32.9, 68.0], color: "#000000" } 
    ];

      rivers.forEach(p => {
      // Draw line from river center to label box
      let line = L.polyline([p.center, p.label], { color: 'black', weight: 1 }).addTo(map);

      // Add label with colored background box
      let text = L.marker(p.label, {
        icon: L.divIcon({
        className: 'river-label',
        html: `<div style="
        display:inline-block;
        background:${p.color};
        color:white;
        padding:4px 10px;
        border-radius:5px;
        font-size:12px;
        font-weight:bold;
        text-align:center;
        white-space:nowrap;
        box-shadow:0 2px 5px rgba(0,0,0,0.3);">
          ${p.name}
        </div>`
        })
      }).addTo(map);

      waterLabels.push(line, text);
    });
  }
}

  
/* ==== Crop Buttons ==== */
document.getElementById('btn1').addEventListener('click', () => toggleCrop("cotton"));
document.getElementById('btn2').addEventListener('click', () => toggleCrop("rice"));
document.getElementById('btn3').addEventListener('click', () => toggleCrop("sesame_seed"));
document.getElementById('btn4').addEventListener('click', () => toggleCrop("wheat"));

</script>
</body>
</html>
